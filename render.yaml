# Staging only. Current deployment and expiry are recorded in docs/DEPLOYMENT.md.
services:
  - type: web
    name: nativos1109
    runtime: node
    plan: free
    region: oregon
    branch: codex/feature/secure-pos-foundation
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server/migrate.js && node dist/server/main.js
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: APP_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nativos1109-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: nativos1109-db
    plan: free
    region: oregon
    databaseName: nativos1109
    user: nativos
    postgresMajorVersion: '17'
    ipAllowList: []
