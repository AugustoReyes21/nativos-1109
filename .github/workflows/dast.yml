name: Isolated ZAP baseline
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: nativos, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: nativos_load_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nativos" --health-interval 5s --health-retries 10
    env:
      LOAD_DATABASE_URL: postgresql://nativos:ci_only@localhost:5432/nativos_load_test
      LOAD_ORIGIN: http://localhost:3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: npm ci && npm run build
      - name: Start isolated fixture
        run: |
          npx tsx load/server.ts > /tmp/pos.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://localhost:3001/health/ready && break; sleep 1; done
          curl --fail http://localhost:3001/health/ready
      - name: Scan unauthenticated web surface
        run: |
          mkdir -p .local
          chmod 777 .local
          status=0
          docker run --rm --network host -v "$PWD/.local:/zap/wrk" ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap-baseline.py -t http://localhost:3001 -J zap.json -r zap.html -m 1 || status=$?
          if [ "$status" -gt 2 ]; then exit "$status"; fi
          node scripts/check-security-reports.mjs zap .local/zap.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: zap-baseline, path: '.local/zap.*', retention-days: 7 }
