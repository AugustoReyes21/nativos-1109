name: Quality and security
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nativos
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: nativos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nativos -d nativos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nativos:ci_only@localhost:5432/nativos_test
      E2E_DATABASE_URL: postgresql://nativos:ci_only@localhost:5432/nativos_e2e_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Scan complete Git history (gitleaks v8.24.3, pinned by digest)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --no-banner
      - name: Create isolated E2E database
        run: PGPASSWORD=ci_only psql -h localhost -U nativos -d postgres -c 'CREATE DATABASE nativos_e2e_test'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: browser-test-results, path: test-results/, retention-days: 7 }
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with: { output: .local/codeql }
      - run: node scripts/check-security-reports.mjs sarif .local/codeql
