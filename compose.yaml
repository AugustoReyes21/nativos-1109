services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nativos
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: nativos
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nativos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nativos -d nativos"]
      interval: 3s
      retries: 20
volumes:
  nativos_pg:
